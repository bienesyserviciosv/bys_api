name: Deploy Bys API

on:
  push:
    branches:
      - main

jobs:
  deploy-main:
    name: Deploy main (produccion)
    runs-on: ubuntu-latest
    steps:
#      - name: Notify start
#        run: |
#          curl -s -X POST https://api.telegram.org/bot${{ secrets.TELEGRAM_DEVOPS_BOT_TOKEN }}/sendMessage \
#          -d chat_id=${{ secrets.TELEGRAM_DEVOPS_CHAT_ID }} \
#          -d message_thread_id=${{ secrets.TELEGRAM_DEVOPS_TOPIC_ID }} \
#          -d text=$'🚀 Deploy en dev iniciado'

      - name: Checkout code
        uses: actions/checkout@v4

      - name: SSH to VPS and run commands
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /home/ubuntu/bys_api
            git fetch origin
            git checkout main
            git pull origin main
            sudo docker compose down
            sudo docker compose up -d --build

