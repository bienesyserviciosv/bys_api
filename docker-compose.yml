version: '3.8'

services:
  postgres:
    image: postgres:14-alpine
    env_file:
      - .env
    ports:
      - ${DB_PORT}:5432
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $POSTGRES_USER"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: always

  app:
    build: .
    ports:
      - ${API_PORT}:8080
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    restart: always

volumes:
  postgres-data:
