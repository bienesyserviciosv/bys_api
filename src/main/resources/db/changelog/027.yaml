databaseChangeLog:
  - changeSet:
      id: 1772000000000-1
      author: Carlos
      objectQuotingStrategy: QUOTE_ONLY_RESERVED_WORDS
      preConditions:
        - onFail: MARK_RAN
        - and:
            - columnExists:
                tableName: service_provider
                columnName: verified
            - not:
                - columnExists:
                    tableName: service_provider
                    columnName: admin_verified
      changes:
        - renameColumn:
            tableName: service_provider
            oldColumnName: verified
            newColumnName: admin_verified
            columnDataType: BOOLEAN

  - changeSet:
      id: 1772000000000-2
      author: Carlos
      objectQuotingStrategy: QUOTE_ONLY_RESERVED_WORDS
      preConditions:
        - onFail: MARK_RAN
        - columnExists:
            tableName: service_provider
            columnName: admin_verified
      changes:
        - sql:
            sql: |
              UPDATE service_provider
              SET status = 'INACTIVE'
              WHERE status = 'ACTIVE'
                AND (admin_verified = false OR admin_verified IS NULL);
