databaseChangeLog:
  - changeSet:
      id: 1763237517823-1
      author: Carlos
      objectQuotingStrategy: QUOTE_ONLY_RESERVED_WORDS
      changes:
        - addColumn:
            columns:
              - column:
                  name: notification_type
                  type: VARCHAR(255)
            tableName: notification
        - sql:
            sql: |
              UPDATE notification
              SET notification_type = 'NEW_REQUEST'
              WHERE message = 'Nueva solicitud disponible' AND notification_type IS NULL;  
              
              UPDATE notification
              SET notification_type = 'PAID_OFFER'
              WHERE message = 'Su oferta a la solicitud fue aceptada' AND notification_type IS NULL;  
              
              UPDATE notification
              SET notification_type = 'PAYMENT_ACCEPTED'
              WHERE message = 'Su solicitud fue aceptada' AND notification_type IS NULL;  

  - changeSet:
      id: 1763237517823-2
      author: Carlos
      objectQuotingStrategy: QUOTE_ONLY_RESERVED_WORDS
      changes:
        - sql:
            sql: |
              UPDATE notification
              SET notification_type = 'NEW_REQUEST'
              WHERE message = 'Nueva solicitud disponible en tu zona' AND notification_type IS NULL;

  - changeSet:
      id: 1763237517823-3
      author: Carlos
      objectQuotingStrategy: QUOTE_ONLY_RESERVED_WORDS
      changes:
        - dropColumn:
            tableName: notification
            columns:
              - column:
                  name: message