databaseChangeLog:
  - changeSet:
      id: 1770085132962-1
      author: Carlos
      objectQuotingStrategy: QUOTE_ONLY_RESERVED_WORDS
      changes:
        - addColumn:
            columns:
              - column:
                  name: average_rating
                  type: DOUBLE
            tableName: service_provider
  - changeSet:
      id: 1770085132962-2
      author: Carlos
      objectQuotingStrategy: QUOTE_ONLY_RESERVED_WORDS
      changes:
        - addColumn:
            columns:
              - column:
                  name: star_rating
                  type: DOUBLE
            tableName: comment
  - changeSet:
      id: 1770085132962-3
      author: Carlos
      objectQuotingStrategy: QUOTE_ONLY_RESERVED_WORDS
      changes:
        - update:
            tableName: comment
            columns:
              - column:
                  name: star_rating
                  valueNumeric: 4
  - changeSet:
      id: 1770085132962-4
      author: Carlos
      objectQuotingStrategy: QUOTE_ONLY_RESERVED_WORDS
      changes:
        - addNotNullConstraint:
            columnName: star_rating
            tableName: comment
  - changeSet:
      id: 1770085132962-5
      author: Carlos
      objectQuotingStrategy: QUOTE_ONLY_RESERVED_WORDS
      changes:
        - sql:
            sql: |
              UPDATE service_provider sp
              SET average_rating = (
                SELECT AVG(c.star_rating)
                FROM comment c
                WHERE c.provider_id = sp.id
              )
              WHERE EXISTS (
                SELECT 1 FROM comment c WHERE c.provider_id = sp.id
              );
  - changeSet:
      id: 1770085132962-6
      author: Carlos
      objectQuotingStrategy: QUOTE_ONLY_RESERVED_WORDS
      changes:
        - dropColumn:
            columnName: average_rating
            tableName: service_provider
  - changeSet:
      id: 1770085132962-7
      author: Carlos
      objectQuotingStrategy: QUOTE_ONLY_RESERVED_WORDS
      changes:
        - sql:
            sql: |
              UPDATE service_provider sp
              SET qualification = (
                SELECT AVG(c.star_rating)
                FROM comment c
                WHERE c.provider_id = sp.id
              )
              WHERE EXISTS (
                SELECT 1 FROM comment c WHERE c.provider_id = sp.id
              );
  - changeSet:
      id: 1770085132962-8
      author: Carlos
      objectQuotingStrategy: QUOTE_ONLY_RESERVED_WORDS
      changes:
        - sql:
            sql: |
              UPDATE service_provider
              SET membership_type = 'BASIC'
              WHERE membership_type = 'BRONZE'
                AND (
                      completed_services < 5
                      OR qualification < 4.5
                    );


