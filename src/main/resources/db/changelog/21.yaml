            referencedTableName: service_provider
  - changeSet:
      id: 1767063506814-6
      author: Carlos
      objectQuotingStrategy: QUOTE_ONLY_RESERVED_WORDS
      changes:
        - addForeignKeyConstraint:
            baseColumnNames: request_id
            baseTableName: comment
            constraintName: FK_COMMENT_ON_REQUEST
            referencedColumnNames: id
            referencedTableName: service_request
  - changeSet:
      id: 1767063506814-7
      author: Carlos
      objectQuotingStrategy: QUOTE_ONLY_RESERVED_WORDS
      changes:
