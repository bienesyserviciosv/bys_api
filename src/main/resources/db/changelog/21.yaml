databaseChangeLog:
  - changeSet:
      id: 1767063506814-1
      author: Carlos
      objectQuotingStrategy: QUOTE_ONLY_RESERVED_WORDS
      changes:
        - createTable:
            columns:
              - column:
                  autoIncrement: true
                  constraints:
                    nullable: false
                    primaryKey: true
                    primaryKeyName: pk_comment
                  name: id
                  type: BIGINT
              - column:
                  name: text
                  type: VARCHAR(255)
              - column:
                  name: comment_date
                  type: DATETIME
              - column:
                  name: author_id
                  type: BIGINT
              - column:
                  name: provider_id
                  type: BIGINT
              - column:
                  name: request_id
                  type: BIGINT
            tableName: comment
  - changeSet:
      id: 1767063506814-2
      author: Carlos
      objectQuotingStrategy: QUOTE_ONLY_RESERVED_WORDS
      changes:
        - addColumn:
            columns:
              - column:
                  name: comment_id
                  type: BIGINT
            tableName: service_request
  - changeSet:
      id: 1767063506814-3
      author: Carlos
      objectQuotingStrategy: QUOTE_ONLY_RESERVED_WORDS
      changes:
        - addUniqueConstraint:
            columnNames: request_id
            constraintName: uc_comment_request
            tableName: comment
  - changeSet:
      id: 1767063506814-4
      author: Carlos
      objectQuotingStrategy: QUOTE_ONLY_RESERVED_WORDS
      changes:
        - addForeignKeyConstraint:
            baseColumnNames: author_id
            baseTableName: comment
            constraintName: FK_COMMENT_ON_AUTHOR
            referencedColumnNames: id
            referencedTableName: final_user
  - changeSet:
      id: 1767063506814-5
      author: Carlos
      objectQuotingStrategy: QUOTE_ONLY_RESERVED_WORDS
