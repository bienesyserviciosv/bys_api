databaseChangeLog:
  - changeSet:
      id: 1763247363186-1
      author: Carlos
      objectQuotingStrategy: QUOTE_ONLY_RESERVED_WORDS
      changes:
        - addColumn:
            columns:
              - column:
                  name: offer_id
                  type: BIGINT
            tableName: notification
  - changeSet:
      id: 1763247363186-2
      author: Carlos
      objectQuotingStrategy: QUOTE_ONLY_RESERVED_WORDS
      changes:
        - addForeignKeyConstraint:
            baseColumnNames: offer_id
            baseTableName: notification
            constraintName: FK_NOTIFICATION_ON_OFFER
            referencedColumnNames: id
            referencedTableName: offer

  - changeSet:
      id: 1763247363186-2b
      author: Carlos
      objectQuotingStrategy: QUOTE_ONLY_RESERVED_WORDS
      preConditions:
        - onFail: MARK_RAN
        - not:
            - columnExists:
                tableName: service_request
                columnName: accepted_offer_id
      changes:
        - addColumn:
            columns:
              - column:
                  name: accepted_offer_id
                  type: BIGINT
            tableName: service_request
        - addForeignKeyConstraint:
            baseColumnNames: accepted_offer_id
            baseTableName: service_request
            constraintName: FK_SERVICE_REQUEST_ON_ACCEPTED_OFFER
            referencedColumnNames: id
            referencedTableName: offer

  - changeSet:
      id: 1763247363186-3
      author: Carlos
      objectQuotingStrategy: QUOTE_ONLY_RESERVED_WORDS
      changes:
        - sql:
            sql: |
              UPDATE notification
              SET offer_id = (
                SELECT sr.accepted_offer_id
                FROM service_request sr
                WHERE sr.id = notification.service_request_id
              )
              WHERE notification_type = 'PAID_OFFER' AND service_request_id IS NOT NULL AND offer_id IS NULL;

  - changeSet:
      id: 1763247363186-4
      author: Carlos
      objectQuotingStrategy: QUOTE_ONLY_RESERVED_WORDS
      changes:
        - sql:
            sql: |
              DELETE FROM notification
              WHERE notification_type = 'PAID_OFFER'
                AND service_request_id IS NOT NULL
                AND offer_id IS NULL;
