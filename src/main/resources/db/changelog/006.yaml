databaseChangeLog:
  - changeSet:
      id: 1759092348137-1
      author: Carlos
      objectQuotingStrategy: QUOTE_ONLY_RESERVED_WORDS
      changes:
        - addColumn:
            columns:
              - column:
                  name: payment_status
                  type: VARCHAR(255)
            tableName: payment
  - changeSet:
      id: 1759092348137-2
      author: Carlos
      changes:
        - sql:
            sql: |
              UPDATE payment p
              SET payment_status = 'ACCEPTED'
              WHERE EXISTS (
                SELECT 1
                FROM offer o
                JOIN service_request sr ON o.service_request_id = sr.id
                WHERE o.id = p.offer_id
                  AND sr.request_status = 'ACCEPTED'
              );

              UPDATE payment
              SET payment_status = 'PENDING'
              WHERE payment_status IS NULL;          


