databaseChangeLog:
  - changeSet:
      id: 1759461793906-1
      author: Carlos
      objectQuotingStrategy: QUOTE_ONLY_RESERVED_WORDS
      changes:
        - addColumn:
            columns:
              - column:
                  name: creation_date
                  type: DATETIME
            tableName: service_request
        - sql:
            sql: |
              UPDATE service_request
              SET creation_date = CURRENT_TIMESTAMP
              WHERE creation_date IS NULL;
