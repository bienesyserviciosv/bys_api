databaseChangeLog:
  - changeSet:
      id: 1757866626694-1
      author: Carlos
      objectQuotingStrategy: QUOTE_ONLY_RESERVED_WORDS
      changes:
        - addColumn:
            columns:
              - column:
                  name: picture_type
                  type: VARCHAR(255)
            tableName: picture
      rollback:
        - dropColumn:
            columnName: picture_type
            tableName: picture

  - changeSet:
      id: 1757866626694-2
      author: Carlos
      changes:
        - update:
            tableName: picture
            columns:
              - column:
                  name: picture_type
                  value: 'PROFILE'
            where: "url IN (SELECT profile_picture FROM service_provider)"

        - update:
            tableName: picture
            columns:
              - column:
                  name: picture_type
                  value: 'PROFILE'
            where: "url IN (SELECT profile_picture FROM final_user)"

        - update:
            tableName: picture
            columns:
              - column:
                  name: picture_type
                  value: 'WORK'
            where: "service_provider_id IS NOT NULL AND url NOT IN (SELECT profile_picture FROM service_provider)"

        - update:
            tableName: picture
            columns:
              - column:
                  name: picture_type
                  value: 'SERVICE_REQUEST'
            where: "service_request_id IS NOT NULL"

        - update:
            tableName: picture
            columns:
              - column:
                  name: picture_type
                  value: 'PAYMENT_PROOF'
            where: "payment_id IS NOT NULL"
      rollback:
        - sql:
            sql: "UPDATE picture SET picture_type = NULL"

  - changeSet:
      id: 1757866626694-3
      author: Carlos
      changes:
        - addNotNullConstraint:
            tableName: picture
            columnName: picture_type
            columnDataType: VARCHAR(255)
      rollback:
        - dropNotNullConstraint:
            tableName: picture
            columnName: picture_type
            columnDataType: VARCHAR(255)
