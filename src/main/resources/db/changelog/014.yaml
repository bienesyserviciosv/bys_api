databaseChangeLog:
  - changeSet:
      id: 1761180608740-1
      author: Carlos
      objectQuotingStrategy: QUOTE_ONLY_RESERVED_WORDS
      changes:
        - addColumn:
            columns:
              - column:
                  name: completed_requests
                  type: BIGINT
              - column:
                  name: total_request
                  type: BIGINT
            tableName: final_user
  - changeSet:
      id: 1761180608740-2
      author: Carlos
      changes:
        - sql:
            sql: |
              UPDATE final_user fu
              SET total_request = (
                SELECT COUNT(*) FROM service_request sr WHERE sr.final_user_id = fu.id
              );
        - sql:
            sql: |
              UPDATE final_user fu
              SET completed_requests = (
                SELECT COUNT(*) FROM service_request sr WHERE sr.final_user_id = fu.id AND sr.request_status = 'COMPLETED'
              );
