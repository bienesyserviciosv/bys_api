databaseChangeLog:
  - changeSet:
      id: 1759463375462-1
      author: Carlos
      objectQuotingStrategy: QUOTE_ONLY_RESERVED_WORDS
      changes:
        - addColumn:
            columns:
              - column:
                  name: accepted_at
                  type: DATETIME
              - column:
                  name: created_at
                  type: DATETIME
            tableName: offer

        - sql:
            sql: |
              UPDATE offer
              SET created_at = CURRENT_TIMESTAMP
              WHERE created_at IS NULL;
              
              UPDATE offer
              SET accepted_at = CURRENT_TIMESTAMP
              WHERE accepted = TRUE AND accepted_at IS NULL;      
