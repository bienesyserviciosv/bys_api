            baseTableName: service_request
            constraintName: FK_SERVICE_REQUEST_ON_ACCEPTED_OFFER
            referencedColumnNames: id
            referencedTableName: offer
  - changeSet:
      id: 1759094486446-7
      author: Carlos
      objectQuotingStrategy: QUOTE_ONLY_RESERVED_WORDS
      changes:
        - dropTable:
            cascadeConstraints: true
            tableName: service_request_offer_set

  - changeSet:
      id: 1759094486446-8
      author: Carlos
      objectQuotingStrategy: QUOTE_ONLY_RESERVED_WORDS
      changes:
        - sql:
            sql: |
              UPDATE service_request sr
              SET accepted_offer_id = (
                SELECT o.id
                FROM offer o
                WHERE o.service_request_id = sr.id
                  AND o.accepted = true
                LIMIT 1
              )
              WHERE EXISTS (
                SELECT 1
                FROM offer o
                WHERE o.service_request_id = sr.id
                  AND o.accepted = true
              );
  - changeSet:
      id: 1759094486446-9
      author: Carlos
      comment: >
        Poblar accepted_offer_id en solicitudes con estado ACCEPTED
        que tengan al menos una oferta marcada como aceptada.
      changes:
        - sql:
            sql: |
              UPDATE service_request sr
              SET accepted_offer_id = (
                SELECT o.id
                FROM offer o
                WHERE o.service_request_id = sr.id
                  AND o.accepted = true
                LIMIT 1
              )
              WHERE sr.request_status = 'ACCEPTED'
                AND accepted_offer_id IS NULL
                AND EXISTS (
                  SELECT 1
                  FROM offer o
                  WHERE o.service_request_id = sr.id
                    AND o.accepted = true
                );
  - changeSet:
      id: 1759094486446-10
      author: Carlos
      comment: >
        Marcar como aceptadas las ofertas que tienen pagos registrados
        y poblar accepted_offer_id en solicitudes con estado ACCEPTED
        solo si tienen una oferta pagada.
      changes:
        - sql:
            sql: |
              -- Marcar como aceptadas las ofertas que tienen pagos
              UPDATE offer o
              SET accepted = true
              WHERE EXISTS (
                SELECT 1
                FROM payment p
                WHERE p.offer_id = o.id
              )
              AND accepted = false;

              -- Poblar accepted_offer_id en solicitudes con estado ACCEPTED
              -- solo si tienen una oferta pagada
              UPDATE service_request sr
              SET accepted_offer_id = (
                SELECT o.id
                FROM offer o
                JOIN payment p ON p.offer_id = o.id
                WHERE o.service_request_id = sr.id
                LIMIT 1
              )
              WHERE sr.request_status = 'ACCEPTED'
                AND accepted_offer_id IS NULL
                AND EXISTS (
                  SELECT 1
                  FROM offer o
                  JOIN payment p ON p.offer_id = o.id
                  WHERE o.service_request_id = sr.id
                );
  - changeSet:
      id: 1759094486446-11
      author: Carlos
      comment: >
        Poblar service_provider_id en solicitudes con estado ACCEPTED
        usando el proveedor de la única oferta pagada asociada.
      changes:
        - sql:
            sql: |
              UPDATE service_request sr
              SET service_provider_id = (
              SELECT o.provider_id
              FROM offer o
              JOIN payment p ON p.offer_id = o.id
              WHERE o.service_request_id = sr.id
              LIMIT 1
              )
              WHERE sr.request_status = 'ACCEPTED'
              AND service_provider_id IS NULL
              AND EXISTS (
              SELECT 1
              FROM offer o
              JOIN payment p ON p.offer_id = o.id
              WHERE o.service_request_id = sr.id
              );
         
